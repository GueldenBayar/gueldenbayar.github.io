<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt // Guelden Bayar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="contact-page-container">
    <header class="contact-header">
        <span class="brand-sup">GUELDEN BAYAR</span>
        <h1>CONTACT ME</h1>
    </header>
    <div class="contact-wrapper">
        <div class="contact-column form-column">
            <h3 class="column-title">ONLINE INQUIRY</h3>

            <form action="" method="POST">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <textarea name="message" id="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-submit">SENDEN</button>
            </form>
        </div>

        <div class="contact-column info-column">
            <h3 class="column-title">CONTACT DETAILS</h3>
            <div class="info-block">
                <a href="https://github.com/GueldenBayar" class="contact-link">github.com/GueldenBayar</a>
            </div>
            <div class="info-block">
                <h4>Berlin, Mitte</h4>
            </div>
        </div>
    </div>
    <a href="index.html" class="close-button">✕</a>

</div>

</body>
</html>
